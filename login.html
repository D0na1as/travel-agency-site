<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Page</title>
    <link rel="icon" href="img/logo.png" type="image/png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__brand">
        <a class="header__logo-link" href="index.html">
          <img class="header__logo" src="img/logo.png" alt="Best Travel logo – go to Home page" />
        </a>
        <h1 class="header__title">Best Travel</h1>
      </div>
      <nav class="header__nav" aria-label="Main">
        <ul class="header__list">
          <li><a class="header__link" href="index.html">Home</a></li>
          <li><a class="header__link" href="request-form.html">Travel request</a></li>
          <li><a class="header__link header__link--current" aria-current="page">Log in</a></li>
        </ul>
      </nav>
    </header>

    <main class="page">
      <!-- simple centred card -->
      <div class="row justify-content-center">
        <section class="col-md-6 col-lg-4" id="login">
          <div class="card card-body p-4">
            <h2 class="mb-4">Log in</h2>

            <form action="personal-blog.html" method="post">
              <div class="mb-3">
                <label class="form-label" for="name">Name</label>
                <input
                  class="form-control"
                  type="text"
                  id="name"
                  name="name"
                  required
                  pattern="[A-Za-zĄČĘĖĮŠŲŪŽąčęėįšųūž ]{2,30}"
                  title="Name must be 2–30 letters"
                  autocomplete="name"
                />
              </div>

              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input
                  class="form-control"
                  type="email"
                  id="email"
                  name="email"
                  required
                  placeholder="name@example.com"
                  autocomplete="email"
                />
              </div>

              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input
                  class="form-control"
                  type="password"
                  id="password"
                  required
                  minlength="8"
                  pattern="(?=.*\d)(?=.*[A-Za-z]).{8,}"
                  title="At least 8 characters, with at least one letter and one number"
                  autocomplete="current-password"
                  aria-describedby="password-help"
                />
                <div id="password-help" class="form-text">
                  At least 8 characters, with a letter and a number
                </div>
              </div>

              <button type="submit" class="button button--full">
                Log in
              </button>
            </form>
          </div>
        </section>
      </div>
    </main>
    <footer class="footer">
      <div class="footer__inner">
        <section class="footer__contact">
          <h2 class="footer__title">Contact us</h2>
          <address class="footer__address">
            Best Travel<br />
            Laisvės al. 10, Kaunas, Lithuania<br />
            Phone: <a class="footer__link" href="tel:+37060000000">+370 600 00000</a><br />
            Email:
            <a class="footer__link" href="mailto:info@besttravel.lt">info@besttravel.lt</a>
          </address>
        </section>
        <iframe
          class="footer__map"
          title="Map: Best Travel office, Laisvės al. 10, Kaunas"
          width="300"
          height="200"
          style="border: 0"
          src="https://maps.google.com/maps?q=laisves%20al.%2010%20kaunas&t=m&z=14&ie=UTF8&iwloc=&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
      <p class="footer__copyright">
        <small class="footer__copyright-text">&copy; 2026 Best Travel. All rights reserved.</small>
      </p>
    </footer>
  </body>
</html>
