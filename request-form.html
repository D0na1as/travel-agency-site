<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Request form page</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <a href="/">
          <img src="img/logo.png" alt="Company logo" />
        </a>
        <h1>Best Travel</h1>
      </div>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a aria-current="/request-form">Travel request</a></li>
          <li><a href="/login">Login</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <form action="index.html" method="get">
        <!-- Contact details -->
        <fieldset>
          <legend>Your contact details</legend>

          <p>
            <label for="name">Name</label><br />
            <input
              type="text"
              id="name"
              name="name"
              required
              pattern="[A-Za-zĄČĘĖĮŠŲŪŽąčęėįšųūž ]{2,30}"
              title="Name must be 2–30 letters"
              autocomplete="name"
            />
          </p>

          <p>
            <label for="email">Email</label><br />
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="name@example.com"
              autocomplete="email"
            />
          </p>

          <p>
            <label for="phone">Phone number</label><br />
            <input
              type="tel"
              id="phone"
              name="phone"
              required
              pattern="\+370[0-9]{8}"
              placeholder="+37060000000"
              title="Format: +370 and 8 digits, e.g. +37060000000"
              autocomplete="tel"
            />
          </p>
        </fieldset>

        <!-- Dropdowns -->
        <fieldset>
          <legend>Trip details</legend>

          <p>
            <label for="destination">Destination</label><br />
            <select id="destination" name="destination" required>
              <option value="">Choose a destination</option>
              <optgroup label="Europe">
                <option value="paris">Paris, France</option>
                <option value="santorini">Santorini, Greece</option>
                <option value="rome">Rome, Italy</option>
              </optgroup>
              <optgroup label="Asia">
                <option value="tokyo">Tokyo, Japan</option>
                <option value="bali">Bali, Indonesia</option>
                <option value="bangkok">Bangkok, Thailand</option>
              </optgroup>
              <optgroup label="America">
                <option value="newyork">New York, USA</option>
                <option value="cancun">Cancún, Mexico</option>
                <option value="rio">Rio de Janeiro, Brazil</option>
              </optgroup>
            </select>
          </p>

          <p>
            <label for="accommodation">Accommodation</label><br />
            <select id="accommodation" name="accommodation" required>
              <option value="">Choose accommodation</option>
              <optgroup label="Hotels">
                <option value="hotel3">3-star hotel</option>
                <option value="hotel4">4-star hotel</option>
                <option value="hotel5">5-star hotel</option>
              </optgroup>
              <optgroup label="Other">
                <option value="apartment">Apartment</option>
                <option value="hostel">Hostel</option>
                <option value="villa">Villa</option>
              </optgroup>
            </select>
          </p>

          <p>
            <label for="travelers">Number of travelers</label><br />
            <select id="travelers" name="travelers" required>
              <option value="">Choose number of travelers</option>
              <optgroup label="Adults only">
                <option value="1">1 adult</option>
                <option value="2">2 adults</option>
                <option value="3+">3 or more adults</option>
              </optgroup>
              <optgroup label="With children">
                <option value="family-small">2 adults + 1 child</option>
                <option value="family-medium">2 adults + 2 children</option>
                <option value="family-large">
                  2 adults + 3 or more children
                </option>
              </optgroup>
            </select>
          </p>

          <p>
            <label for="date">Departure date</label><br />
            <input
              type="date"
              id="date"
              name="date"
              required
              min="2026-10-19"
            />
          </p>
        </fieldset>

        <!-- Checkboxes -->
        <fieldset>
          <legend>Extra services (choose any)</legend>
          <input
            type="checkbox"
            id="insurance"
            name="extras"
            value="insurance"
          />
          <label for="insurance">Travel insurance</label><br />

          <input type="checkbox" id="transfer" name="extras" value="transfer" />
          <label for="transfer">Airport transfer</label><br />

          <input
            type="checkbox"
            id="carrental"
            name="extras"
            value="car-rental"
          />
          <label for="carrental">Car rental</label><br />

          <input type="checkbox" id="guide" name="extras" value="guide" />
          <label for="guide">Tour guide</label><br />

          <input type="checkbox" id="luggage" name="extras" value="luggage" />
          <label for="luggage">Extra luggage</label>
        </fieldset>

        <!-- Radio buttons -->
        <fieldset>
          <legend>Meal plan</legend>
          <input
            type="radio"
            id="meal-none"
            name="meals"
            value="none"
            required
          />
          <label for="meal-none">No meals</label><br />

          <input
            type="radio"
            id="meal-breakfast"
            name="meals"
            value="breakfast"
          />
          <label for="meal-breakfast">Breakfast only</label><br />

          <input type="radio" id="meal-half" name="meals" value="half-board" />
          <label for="meal-half">Half board</label><br />

          <input
            type="radio"
            id="meal-all"
            name="meals"
            value="all-inclusive"
          />
          <label for="meal-all">All inclusive</label>
        </fieldset>

        <!-- Textarea -->
        <fieldset>
          <legend>Your message</legend>
          <label for="message">Anything else we should know?</label><br />
          <textarea
            id="message"
            name="message"
            rows="5"
            cols="50"
            required
            minlength="10"
            placeholder="For example: budget, special wishes, allergies..."
          ></textarea>
        </fieldset>

        <!-- Agreement -->
        <p>
          <input type="checkbox" id="agree" name="agree" required />
          <label for="agree">I agree to be contacted about my inquiry</label>
        </p>

        <button type="submit">Send inquiry</button>
      </form>
    </main>
    <footer>
      <div>
        <section>
          <h2>Contact us</h2>
          <address>
            Best Travel<br />
            Laisvės al. 10, Kaunas, Lithuania<br />
            Phone: <a href="tel:+37060000000">+370 600 00000</a><br />
            Email: <a href="mailto:info@wanderly.lt">info@besttravel.lt</a>
          </address>
        </section>
        <iframe
          width="300"
          height="200"
          style="border: 0"
          src="https://maps.google.com/maps?q=laisves%20al.%2010%20kaunas&t=m&z=14&ie=UTF8&iwloc=&output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
      <p class="copyright">
        <small>&copy; 2026 Best Travel. All rights reserved.</small>
      </p>
    </footer>
  </body>
</html>
